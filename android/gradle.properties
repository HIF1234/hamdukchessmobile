org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Builds on unstable connections: retry dependency downloads more often (default 3 tries,
# 1s back-off) and use TLS 1.2, which avoids bad_record_mac/decrypt_error on some mobile
# networks. Affects only downloading build dependencies, not the app.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.https.protocols=TLSv1.2
